name: Build and publish latest DMG

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run core checks
        run: swift run CodexSwitcherCoreChecks

      - name: Build release executable
        run: swift build --disable-sandbox -c release

      - name: Bundle app
        env:
          CODEX_SWITCHER_SKIP_SWIFT_BUILD: "1"
        run: ./scripts/build-app.sh

      - name: Build DMG
        env:
          CODEX_SWITCHER_SKIP_APP_BUILD: "1"
        run: ./scripts/build-dmg.sh

      - name: Verify DMG contents
        run: |
          mount_dir="$(mktemp -d "$RUNNER_TEMP/codex-switcher-mount.XXXXXX")"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "dist/Codex-Switcher.dmg" >/dev/null
          trap 'hdiutil detach "$mount_dir"' EXIT
          test -d "$mount_dir/Codex Switcher.app"
          test -L "$mount_dir/Applications"

      - name: Create checksum
        run: shasum -a 256 "dist/Codex-Switcher.dmg" > "dist/Codex-Switcher.dmg.sha256"

      - name: Update latest tag
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notes="Latest build from commit ${GITHUB_SHA}. Built at $(date -u '+%Y-%m-%d %H:%M:%S UTC')."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Codex Switcher Latest" --notes "$release_notes" --prerelease=false --latest=false
          else
            gh release create latest --title "Codex Switcher Latest" --notes "$release_notes" --latest=false
          fi
          gh release upload latest \
            "dist/Codex-Switcher.dmg" \
            "dist/Codex-Switcher.dmg.sha256" \
            --clobber

      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_notes="Codex Switcher ${GITHUB_REF_NAME}."
          gh release create "$GITHUB_REF_NAME" \
            "dist/Codex-Switcher.dmg" \
            "dist/Codex-Switcher.dmg.sha256" \
            --title "Codex Switcher ${GITHUB_REF_NAME}" \
            --notes "$release_notes" \
            --verify-tag \
            --latest
